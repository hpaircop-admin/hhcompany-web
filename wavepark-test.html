<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>웨이브파크 결제 테스트 | (주)더블에이치컴퍼니</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.tosspayments.com/v1/payment"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *{box-sizing:border-box}
  body{margin:0;background:#f1f4f0;color:#17302e;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;line-height:1.6}
  .top{background:#17302e;color:#fff;padding:14px 20px;font-weight:800}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 60px}
  .warn{background:#fff3cd;border:1px solid #f0c36d;border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:16px}
  .warn b{color:#b45309}
  .card{background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(14,42,71,.08);padding:22px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:13px;color:#5d6b68;margin:0 0 16px}
</style>
</head>
<body>
<div class="top">HHCOMPANY · 결제 테스트</div>
<div class="wrap">
  <div class="warn"><b>테스트 전용 페이지입니다.</b> 시흥 웨이브파크 개인 결제 흐름을 시험하기 위한 숨은 주소이며, 금액은 <b>100원</b>(실제 카드 결제)입니다. 발급되는 바코드는 실제 입장에 사용할 수 없습니다.</div>
  <div class="card">
    <h1>웨이브파크 (테스트)</h1>
    <p class="sub">개인 구매 · 100원 · 테스트 바코드</p>
    <div class="hhbw-mount" id="buy"></div>
  </div>
</div>
<script src="js/buy-widget.js"></script>
<script>
  HHBuyWidget.init({ mount: '#buy', productId: 'p15_test', venueName: '시흥 웨이브파크-테스트' });
</script>
</body>
</html>
