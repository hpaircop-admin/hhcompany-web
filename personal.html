<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N4BWKWXEQ4"></script>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 전용관 | (주)더블에이치컴퍼니</title>
<meta name="description" content="더블에이치컴퍼니 개인 전용 입장권 구매">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2a47">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --navy:#0e2a47;--navy-deep:#081b30;--blue:#1d6fe0;--sky:#47b6e8;--coral:#ff6b5c;--amber:#ffb648;
    --cream:#f5f8fc;--ink:#16202e;--gray:#64748b;--line:#e2e9f2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.6}
  a{text-decoration:none}

  .topbar{background:linear-gradient(135deg,var(--navy-deep),var(--navy));padding:32px 20px 28px}
  .topbar-inner{max-width:960px;margin:0 auto}
  .topbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .logout-link{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer}
  .logout-link:hover{color:#fff}
  .topbar-inner .brand{display:flex;align-items:center;gap:10px}
  .topbar-inner .brand img{width:28px;height:auto}
  .topbar-inner .brand span{color:#fff;font-weight:800;font-size:15px}
  .topbar-inner .brand span b{color:var(--sky)}
  .topbar-inner h1{color:#fff;font-size:24px;font-weight:800;margin-bottom:8px}
  .topbar-inner p{color:rgba(255,255,255,.75);font-size:13.5px;line-height:1.7}

  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  .cat-section{margin-bottom:36px}
  .cat-section:last-child{margin-bottom:0}
  .cat-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
  .cat-title .cat-count{font-size:11.5px;font-weight:700;color:var(--gray);background:var(--line);padding:2px 9px;border-radius:999px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(14,42,71,.07);overflow:hidden;display:flex;flex-direction:column}
  .card-top{background:linear-gradient(135deg,var(--navy),var(--blue));padding:20px;color:#fff}
  .card-top .emoji{font-size:26px;margin-bottom:8px}
  .card-top .venue{font-size:16px;font-weight:800}
  .card-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card-body .desc{font-size:12.5px;color:var(--gray);line-height:1.6;flex:1}
  .card-price{font-size:20px;font-weight:800;color:var(--coral)}
  .card-price small{font-size:11px;color:var(--gray);font-weight:600}
  .btn-row{display:flex;gap:8px}
  .detail-btn{flex:1;text-align:center;background:#fff;color:var(--navy);border:1.5px solid var(--line);font-size:13px;font-weight:700;padding:11px;border-radius:8px;cursor:pointer}
  .detail-btn:hover{border-color:var(--blue);color:var(--blue)}
  .buy-btn{flex:1;display:block;text-align:center;background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;padding:12px;border-radius:8px;border:none;cursor:pointer}
  .buy-btn:hover{background:var(--blue)}

  .empty{background:#fff;border-radius:14px;padding:60px 24px;text-align:center;color:var(--gray);font-size:14px}
  .loading{padding:60px 24px;text-align:center;color:var(--gray);font-size:14px}

  .foot{margin-top:24px;text-align:center;font-size:11.5px;color:var(--gray);line-height:1.8}
  .foot a{color:var(--blue)}

  /* 자세히보기 모달 */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(8,27,48,.55);z-index:100;align-items:flex-end;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:#fff;width:100%;max-width:520px;max-height:88vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .25s ease}
  @media (min-width:640px){ .modal-bg{align-items:center} .modal{border-radius:16px;max-height:80vh} }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-top{background:linear-gradient(135deg,var(--navy),var(--blue));padding:26px 24px;color:#fff;position:relative}
  .modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1}
  .modal-top .emoji{font-size:32px;margin-bottom:8px}
  .modal-top .venue{font-size:19px;font-weight:800}
  .modal-body{padding:22px 24px 26px}
  .modal-desc{font-size:13.5px;color:var(--ink);line-height:1.8;margin-bottom:18px}
  .modal-feat-title{font-size:12.5px;font-weight:700;color:var(--gray);margin-bottom:8px}
  .modal-feat{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
  .modal-feat li{font-size:13px;color:var(--ink);line-height:1.6;padding-left:18px;position:relative}
  .modal-feat li::before{content:'✓';position:absolute;left:0;color:var(--sky);font-weight:800}
  .modal-price-row{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .modal-price-row .label{font-size:12.5px;color:var(--gray);font-weight:600}
  .modal-price-row .amount{font-size:20px;font-weight:800;color:var(--coral)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-top">
      <div class="brand">
        <img src="logo-icon.png" alt="HHCOMPANY">
        <span>HH<b>COMPANY</b></span>
      </div>
      <a href="#" class="logout-link" id="logout-link">로그아웃</a>
    </div>
    <h1>개인 전용관</h1>
    <p>더블에이치컴퍼니가 안내드린 분들만을 위한 개인 구매 페이지입니다.<br>원하시는 상품을 선택해 온라인으로 결제하실 수 있습니다.</p>
  </div>
</div>

<div class="wrap">
  <div id="list" class="loading">상품을 불러오는 중입니다...</div>
</div>

<div class="modal-bg" id="detail-modal" onclick="if(event.target===this) closeDetail()">
  <div class="modal">
    <div class="modal-top">
      <button class="modal-close" onclick="closeDetail()">×</button>
      <div class="emoji" id="dt-emoji">🎟️</div>
      <div class="venue" id="dt-venue"></div>
    </div>
    <div class="modal-body">
      <div class="modal-desc" id="dt-desc"></div>
      <div id="dt-feat-wrap">
        <div class="modal-feat-title">이용 안내 및 특징</div>
        <ul class="modal-feat" id="dt-feat"></ul>
      </div>
      <div class="modal-price-row">
        <span class="label">개인 구매가 (1인)</span>
        <span class="amount" id="dt-price"></span>
      </div>
      <a class="buy-btn" id="dt-buy-btn" href="#">구매하기 →</a>
    </div>
  </div>
</div>

<div class="foot">
  (주)더블에이치컴퍼니 · 사업자등록번호 420-88-03868<br>
  문의 <a href="tel:031-339-2999">031-339-2999</a>
</div>

<script>
const SB_URL = 'https://xoupacfmkhuuvxebgfqi.supabase.co';
const SB_KEY = 'sb_publishable_46KQebvC7_S-_JDramvDmA_jk9aSeVc';
const sbAuth = supabase.createClient(SB_URL, SB_KEY);

async function sbFetch(path) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` },
  });
  if (!res.ok) throw new Error(`오류 ${res.status}`);
  return res.json();
}

function money(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }

let CATALOG = [];

// products.cat 값(waterpark/theme/experience/performance) 기준으로 섹션을 나눔.
// 관리자 화면(admin/index.html #prod-cat)에서 실제 쓰는 값과 동일하게 맞춤.
const CAT_ORDER = ['waterpark', 'theme', 'experience', 'performance'];
const CAT_LABELS = {
  waterpark: '🌊 워터파크',
  theme: '🎡 놀이공원 · 테마파크',
  experience: '🎨 체험 · 키즈파크',
  performance: '🎭 공연',
};

// 일부 상품은 전용 판매 페이지(브랜드 소개+결제까지 한 페이지)가 따로 있음 —
// 그런 상품은 "구매하기"를 buy.html이 아니라 그 전용 페이지로 바로 연결한다.
// id가 아니라 업장명/상품명 문자열로 매칭 — 카탈로그의 실제 products.id 값이
// 바뀌어도(예: p14 → 다른 값) 깨지지 않도록 함.
const CUSTOM_SALES_PAGES = [
  { match: n => /아일랜드캐슬/.test(n), url: 'islandcastle-personal.html' },
  { match: n => /jump/i.test(n) || /점프/.test(n), url: 'ion-jumpkids.html' },
];
function customPageFor(p) {
  const name = (p.vname || p.name || '');
  const found = CUSTOM_SALES_PAGES.find(c => c.match(name));
  return found ? found.url : null;
}
function buyUrlFor(p) {
  return customPageFor(p) || ('buy.html?product=' + encodeURIComponent(p.id));
}

function cardHtml(p) {
  return `
    <div class="card">
      <div class="card-top">
        <div class="emoji">${p.emoji || '🎟️'}</div>
        <div class="venue">${p.vname || p.name}</div>
      </div>
      <div class="card-body">
        <div class="desc">${p.desc || p.name}</div>
        <div class="card-price">${money(p.indiv_price)} <small>1인</small></div>
        <div class="btn-row">
          <button type="button" class="detail-btn" onclick="openDetail('${p.id}')">자세히보기</button>
          <a class="buy-btn" href="${buyUrlFor(p)}">구매하기 →</a>
        </div>
      </div>
    </div>
  `;
}

async function loadCatalog() {
  const list = document.getElementById('list');
  try {
    const rows = await sbFetch('indiv_products_public?select=*&order=sort_order.asc');
    CATALOG = rows || [];
    if (!CATALOG.length) {
      list.innerHTML = `<div class="empty">현재 판매 중인 개인 전용 상품이 없습니다.<br>문의: 031-339-2999</div>`;
      return;
    }
    list.className = '';

    // cat 값 기준으로 그룹핑 — 알 수 없는/빈 값은 '체험'류로 묶어서 누락되는 상품이 없게 함
    const groups = {};
    CATALOG.forEach(p => {
      const key = CAT_ORDER.includes(p.cat) ? p.cat : 'experience';
      (groups[key] = groups[key] || []).push(p);
    });

    list.innerHTML = CAT_ORDER
      .filter(k => groups[k] && groups[k].length)
      .map(k => `
        <div class="cat-section">
          <div class="cat-title">${CAT_LABELS[k]}<span class="cat-count">${groups[k].length}</span></div>
          <div class="grid">${groups[k].map(cardHtml).join('')}</div>
        </div>
      `).join('');
  } catch (e) {
    list.className = 'loading';
    list.innerHTML = `불러오지 못했습니다. 잠시 후 다시 시도해주세요.`;
  }
}

function openDetail(id) {
  const p = CATALOG.find(x => x.id === id);
  if (!p) return;
  document.getElementById('dt-emoji').textContent = p.emoji || '🎟️';
  document.getElementById('dt-venue').textContent = p.vname || p.name;
  document.getElementById('dt-desc').textContent = p.desc || p.name;
  document.getElementById('dt-price').textContent = money(p.indiv_price);
  document.getElementById('dt-buy-btn').href = buyUrlFor(p);

  const feat = Array.isArray(p.features) ? p.features : [];
  const featWrap = document.getElementById('dt-feat-wrap');
  const featList = document.getElementById('dt-feat');
  if (feat.length) {
    featWrap.style.display = '';
    featList.innerHTML = feat.map(f => `<li>${f}</li>`).join('');
  } else {
    featWrap.style.display = 'none';
  }

  document.getElementById('detail-modal').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-modal').classList.remove('open');
}

// 회원가입/로그인한 사람만 개인구매채널을 볼 수 있도록 가드.
// 세션이 없으면 로그인 페이지로 보내고, 로그인 완료 후 다시 이 페이지로 돌아온다.
(async function guardAuthAndInit() {
  const { data: { session } } = await sbAuth.auth.getSession();
  if (!session) {
    location.href = 'login.html?redirect=personal.html';
    return;
  }
  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await sbAuth.auth.signOut();
    location.href = 'index.html';
  });
  loadCatalog();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
