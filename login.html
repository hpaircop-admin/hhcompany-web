<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 / 로그인 | (주)더블에이치컴퍼니</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2a47">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --navy:#0e2a47;--navy-deep:#081b30;--blue:#1d6fe0;--sky:#47b6e8;--coral:#ff6b5c;--amber:#ffb648;
    --cream:#f5f8fc;--ink:#16202e;--gray:#64748b;--line:#e2e9f2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.6}
  .topbar{background:var(--navy-deep);padding:14px 20px;display:flex;align-items:center;gap:10px}
  .topbar img{width:28px;height:auto}
  .topbar span{color:#fff;font-weight:800;font-size:15px}
  .topbar span b{color:var(--sky)}

  .wrap{max-width:420px;margin:0 auto;padding:40px 16px 60px}
  .card{background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(14,42,71,.08);overflow:hidden}
  .card-head{background:linear-gradient(135deg,var(--navy),var(--blue));padding:24px;color:#fff}
  .card-head .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
  .card-head .title{font-size:20px;font-weight:800}
  .card-body{padding:24px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fafbfd}
  .field input:focus{outline:none;border-color:var(--blue);background:#fff}

  .submit-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
  .submit-btn:hover{background:var(--blue)}
  .submit-btn:disabled{background:var(--line);color:var(--gray);cursor:not-allowed}

  .msg{font-size:12.5px;color:var(--gray);margin-top:12px;line-height:1.6}
  .msg.error{color:#dc2626}
  .msg.success{color:#16a34a}
  .link-back{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--gray);text-decoration:none}
  .link-back:hover{color:var(--blue)}
</style>
</head>
<body>

<div class="topbar">
  <img src="logo-icon.png" alt="HHCOMPANY">
  <span>HH<b>COMPANY</b> · 개인 회원</span>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-head">
      <div class="eyebrow">Sign Up · Login</div>
      <div class="title">회원가입 / 로그인</div>
    </div>
    <div class="card-body">
      <div id="step-email">
        <p style="font-size:12.5px;color:var(--gray);line-height:1.6;margin-bottom:16px">아래 정보를 입력하시면 별도 가입 절차 없이 이메일 인증 링크로 바로 회원가입 및 로그인됩니다. 회원가입 후 개인 전용 구매 페이지를 이용하실 수 있습니다. (이미 가입하신 분은 이메일만 입력해주세요)</p>
        <div class="field">
          <label>이름</label>
          <input type="text" id="f-name" placeholder="이름을 입력해주세요">
        </div>
        <div class="field">
          <label>연락처</label>
          <input type="tel" id="f-phone" placeholder="010-0000-0000">
        </div>
        <div class="field">
          <label>이메일</label>
          <input type="email" id="f-email" placeholder="example@email.com">
        </div>
        <button type="button" class="submit-btn" id="send-btn" onclick="sendCode()">인증코드 받기</button>
        <div class="msg" id="email-msg"></div>
      </div>

      <div id="step-code" style="display:none">
        <p style="font-size:12.5px;color:var(--gray);line-height:1.6;margin-bottom:16px" id="code-sent-to">입력하신 이메일로 인증코드를 보내드렸습니다. 메일함에서 코드를 확인해 아래에 입력해주세요.</p>
        <div class="field">
          <label>인증코드</label>
          <input type="text" id="f-code" placeholder="이메일로 받은 코드 입력" inputmode="numeric" maxlength="12" style="letter-spacing:3px;font-size:20px;text-align:center;font-weight:700">
        </div>
        <button type="button" class="submit-btn" id="verify-btn" onclick="verifyCode()">인증코드 확인</button>
        <div class="msg" id="code-msg"></div>
        <a href="#" class="link-back" onclick="resendCode();return false" id="resend-link">인증코드 다시 받기</a>
        <a href="#" class="link-back" onclick="backToEmail();return false">이메일 다시 입력하기</a>
      </div>

      <div id="step-checking" style="display:none">
        <div class="msg" style="font-size:14px;color:var(--ink)">로그인 확인 중입니다...</div>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://xoupacfmkhuuvxebgfqi.supabase.co';
const SB_KEY = 'sb_publishable_46KQebvC7_S-_JDramvDmA_jk9aSeVc';
const sb = supabase.createClient(SB_URL, SB_KEY);

let pendingEmail = '';
let pendingName = '';
let pendingPhone = '';

function getRedirectTarget() {
  const params = new URLSearchParams(location.search);
  return params.get('redirect') || 'personal.html';
}

function showStep(step) {
  document.getElementById('step-email').style.display = step === 'email' ? '' : 'none';
  document.getElementById('step-code').style.display = step === 'code' ? '' : 'none';
  document.getElementById('step-checking').style.display = step === 'checking' ? '' : 'none';
}

async function sendCode() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const msg = document.getElementById('email-msg');
  const btn = document.getElementById('send-btn');
  if (!name) { msg.textContent = '이름을 입력해주세요.'; msg.className = 'msg error'; return; }
  if (!phone) { msg.textContent = '연락처를 입력해주세요.'; msg.className = 'msg error'; return; }
  if (!email) { msg.textContent = '이메일을 입력해주세요.'; msg.className = 'msg error'; return; }

  btn.disabled = true; btn.textContent = '전송 중...';
  // name/phone은 신규 가입일 때만 auth.users.raw_user_meta_data에 실려서 저장되고,
  // DB 트리거(handle_new_user)가 profiles 테이블로 자동 복사합니다.
  // 이미 가입된 이메일이면 이 값들은 무시되고 인증코드만 재발송됩니다.
  // emailRedirectTo를 넘기지 않으면 링크 대신 6자리 코드로 인증하는 방식이 됩니다.
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: true, data: { name, phone } },
  });
  btn.disabled = false; btn.textContent = '인증코드 받기';

  if (error) {
    msg.textContent = '전송 실패: ' + error.message;
    msg.className = 'msg error';
    return;
  }
  pendingEmail = email; pendingName = name; pendingPhone = phone;
  document.getElementById('code-sent-to').textContent = `${email} 로 인증코드를 보내드렸습니다. 메일함에서 코드를 확인해 아래에 입력해주세요.`;
  document.getElementById('f-code').value = '';
  document.getElementById('code-msg').textContent = '';
  msg.textContent = '';
  showStep('code');
}

async function verifyCode() {
  const code = document.getElementById('f-code').value.trim();
  const msg = document.getElementById('code-msg');
  const btn = document.getElementById('verify-btn');
  if (!code) { msg.textContent = '이메일로 받은 코드를 입력해주세요.'; msg.className = 'msg error'; return; }

  btn.disabled = true; btn.textContent = '확인 중...';
  const { data, error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
  btn.disabled = false; btn.textContent = '인증코드 확인';

  if (error) {
    msg.textContent = '인증 실패: 코드가 올바르지 않거나 만료되었습니다. 다시 시도해주세요.';
    msg.className = 'msg error';
    return;
  }
  if (data && data.session) {
    location.href = getRedirectTarget();
  }
}

async function resendCode() {
  const msg = document.getElementById('code-msg');
  if (!pendingEmail) { backToEmail(); return; }
  msg.textContent = '재전송 중...';
  msg.className = 'msg';
  const { error } = await sb.auth.signInWithOtp({
    email: pendingEmail,
    options: { shouldCreateUser: true, data: { name: pendingName, phone: pendingPhone } },
  });
  msg.textContent = error ? ('재전송 실패: ' + error.message) : '인증코드를 다시 보내드렸습니다.';
  msg.className = error ? 'msg error' : 'msg success';
}

function backToEmail() {
  showStep('email');
}

// 세션이 만들어지는 대로(코드 인증 성공 시) 원래 가려던 곳으로 이동
sb.auth.onAuthStateChange((event, session) => {
  if (session) location.href = getRedirectTarget();
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { location.href = getRedirectTarget(); }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
